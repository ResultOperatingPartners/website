# Publiceert alleen de websitebestanden naar GitHub Pages (tijdelijk, tot de TransIP-webhosting draait).
name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Alleen de site verzamelen
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml llms.txt afspraak.html privacy.html _site/
          cp -r afspraak privacy assets .well-known _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
