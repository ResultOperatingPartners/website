# Publiceert alleen de websitebestanden naar GitHub Pages (tijdelijk, tot de TransIP-webhosting draait).
name: Website publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 6-21 * * *'   # agenda elk kwartier bijwerken (overdag); veilig dankzij de retry hieronder
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Alleen de site verzamelen
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml llms.txt afspraak.html privacy.html _site/
          cp -r afspraak privacy interimmers assets .well-known _site/
      - name: Bezette momenten uit de agenda
        env:
          AGENDA_ICS_URL: ${{ secrets.AGENDA_ICS_URL }}
        run: |
          if [ -n "$AGENDA_ICS_URL" ]; then pip install -q icalendar recurring-ical-events; fi
          python3 .github/scripts/bezet.py _site/assets/bezet.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true
      - name: Wachten voor retry (tijdelijke GitHub-storing)
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        name: Publicatie opnieuw proberen
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
